name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Smoke test the CLI
        run: |
          go build -o ops ./cmd/ops
          test "$(./ops to-base64 hello)" = "aGVsbG8="
          test "$(./ops render 'to-hex{hi}')" = "6869"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
